{msg}
<!--Filter-->
<table style="float:left;">
    <tr>
        <td class="l b" style="width:180px;">GroupID:</td>
        <td>{groupid}</td>
        <td></td>
		<td></td>
    </tr>
    <tr>
        <td class="l b">Group Max Loss (RM):</td>
        <td>{GroupHeadlineMaxLoss}</td>
        <td></td>
        <td></td>
    </tr>
    <tr>    
        <td colspan="3"><span class="b">Usernames </span>&nbsp;(Separated by ','):</td>
    </tr>
    <tr>
        <td colspan="3">
            <textarea type="text" name="txtuser" id="txtuser" rows="4" cols="120"></textarea>
        </td>
    </tr>
    <tr>
        <td><input class="btn" type="button" onclick="ExecuteCreditTerm('1');" value="Add to Group" name="btnadd"></input></td>
        <td></td>
        <td></td>
    </tr>
</table>
<div style="float:right;padding-top:55px;">
	<div class="btngroup"><input type="button" title="Export to Excel" class="btnExcel" id="btnExport" name="btnExport" value="  " onclick="ExportToExcel({groupid});" /></div>
</div>
<!--/Filter-->
<div id="dvcontent">
<table class="tbllayout" cellspacing="1">
    <tr class="title">
        <td>#</td>
        <td>UserName</td>
        <td style="width:100px;">Currency</td>
        <td style="width:100px;">Total Balance</td>
        <td style="width:100px;">Max Loss</td>
        <td style="width:100px;">Set Headline</td>
        <td style="width:100px;"><input type="checkbox" id="chkcheckall" onclick="checkall();" /></td>
    </tr>
    <!--UserRow-->
    <tr align="center" class="{row-even}">
        <td>{No}</td>
        <td class="{headlineclasstext}">{UserName}</td>
        <td class="c">{Currency}</td>
        <td class="r">{TotalBalance}</td>
        <td class="r">{MaxLoss}</td>
        <td class="c">
            <img src="{headline}" onclick="{jsaddheadline}" title="{title}" width="16px" height="14px" border="0" style="cursor:pointer;" />
       </td>
        <td class="c">{removeitem}</td>
    </tr>
    <!--/UserRow-->
    {UserRowList}
    <tr class="title">
        <td colspan="2" class="r b">Group Total Balance</td>
        <td class="c b">RM</td>
        <td class="c r">{SumTotalBalance}</td>
        <td></td>
        <td></td>
        <td></td>
    </tr>
    <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="c"><input class="btn" onclick="ExecuteCreditTerm('3');" type="button" value="Remove" name="btnremove"></input></td>
    </tr>
</table>
</div>
