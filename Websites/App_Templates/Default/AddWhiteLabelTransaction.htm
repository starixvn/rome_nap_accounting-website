<table class="tbllayout" style="width: 320px;" cellspacing="1">
    <tr>
        <td class="l b">
            Username
        </td>
        <td class="l b">
            {addtxn}
        </td>
    </tr>
    <tr>
        <td class="l b">
            {date}:
        </td>
        <td class="l">
            {btnDate}
        </td>
    </tr>
    <tr>
        <td class="l b">
            {amount}:
        </td>
        <td class="l">
            <input class="txt" type="text" name="txtWhiteLabelAmount" value="0.00" id="txtWhiteLabelAmount" /> <span class="b">THB</span>
        </td>
    </tr>
    <tr>
        <td class="l b">
            {desc}:
        </td>
        <td class="l">
            <input class="txt" style="width: 200px;" type="text" name="txtWhiteLabelDesc" id="txtWhiteLabelDesc" />
        </td>
    </tr>
    <tr>
        <td colspan="2" class="c">
            <input class="btn" type="submit" name="btnWhiteLabelAdd" id="btnWhiteLabelAdd" value="{add}" />
        </td>
    </tr>
</table>
