<form method="post" name="pw" onsubmit="return changePwd();">
  <table class="tbllayout" style="width:300px;" cellspacing="1">    
    <tr class="title">
      <td colspan="2">Reset Password: {username}</td>
    </tr>    
    <tr>
      <td class="l b">Password:</td>
      <td class="l">
        <input class="txt" type="password" id="txtPass" name="txtPass" />
      </td>
    </tr>
    <tr>
      <td class="l b">Confirm Password:</td>
      <td class="l">
        <input class="txt"  type="password" id="txtConfirmPass" name="txtConfirmPass" />
      </td>
    </tr>
    <tr>
      <td class="c" colspan="2">
        <input class="btn" type="submit" value="Submit" /><input class="btn" type="reset" value="Reset" />
        <input id="code" name="code" type="hidden" value="{code}" />
      </td>
    </tr>
  </table>
  {hidden}
</form>
