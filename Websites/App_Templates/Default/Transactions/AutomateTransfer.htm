<table class="tbllayout" cellspacing="1" style="width:796px !important;">
    <tr class="title">
        <td style="width:30px">
            No
        </td>
        <td style="width:60px;">
            From Cust
        </td>
        <td style="width:60px;">
            To Cust
        </td>
        <td style="width:80px;">
            Amount
        </td>
        <td style="width:80px;">
            Actual Rate
        </td>
        <td>
            Business Unit
        </td>
        <td>
            Description
        </td>
        <td>
            Collection
        </td>
        <!--hreason-->
        <td>
            {HeaderReason}
        </td>
        <!--/hreason-->
    </tr>
    <!--content-->
    <tr class="{rowstyle}">
        <td>
            {no}
        </td>
        <td>
            {fromcust}
        </td>
        <td>
            {tocust}
        </td>
        <td class="r">
            {amount}
        </td>
        <td class="r {actualRateCSS}">
            {actualrate}
        </td>
        <td>
            {buid}
        </td>
        <td>
            {description}
        </td>
        <td>
            {collection}
        </td>

        <!--creason-->
        <td class="{reasonCss}">
            {reason}
        </td>
        <!--/creason-->
    </tr>
    <!--/content-->
</table>
