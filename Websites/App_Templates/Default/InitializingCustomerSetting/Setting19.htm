<!-- Commission -->
<tr class="setting-row row-item">
    <td class="setting-col col-item text-center" rowspan="4">{sport-type}</td>
    <td class="setting-col col-item text-center" rowspan="4">{bet-type}</td>
    <td class="setting-col col-item text-center" rowspan="2"><input type="checkbox" {ckbDefault} />Default</td>
    <td class="setting-col col-item text-center">Super</td>
    <td class="setting-col col-item text-center">Master</td>
    <td class="setting-col col-item text-center">Agent</td>
    <td class="setting-col col-item text-center">Member</td>
</tr>
<tr class="setting-row row-item">
    <td class="setting-col col-item"><input type="text" value="{comSuper}" /></td>
    <td class="setting-col col-item"><input type="text" value="{comMaster}" /></td>
    <td class="setting-col col-item"><input type="text" value="{comAgent}" /></td>
    <td class="setting-col col-item"><input type="text" value="{comMember}" /></td>
</tr>
<tr class="setting-row row-item">
    <td class="setting-col col-item text-center" rowspan="2"><input type="checkbox" {ckbCopy} />Copy From</td>
    <td class="setting-col col-item text-center">Sport Type</td>
    <td class="setting-col col-item text-center">Bet Type</td>
    <td class="setting-col col-item"></td>
    <td class="setting-col col-item"></td>
</tr>
<tr class="setting-row row-item text-center">
    <td class="setting-col col-item">
        <select>
            {sporttypeopts}
        </select>
    </td>
    <td class="setting-col col-item text-center">
        <select>
            {bettypeopts}
        </select>
    </td>
    <td class="setting-col col-item"></td>
    <td class="setting-col col-item"></td>
</tr>
