<!-- Product Status -->
<tr class="setting-row row-item text-center">
    <td class="setting-col col-item" rowspan="6">{sport-type}</td>
    <td class="setting-col col-item" rowspan="6">{bet-type}</td>
    <td class="setting-col col-item" rowspan="2"><input class="edit-input" type="checkbox" {ckbDefault} />Default</td>
    <td class="setting-col col-item">Super</td>
    <td class="setting-col col-item">Master</td>
    <td class="setting-col col-item">Agent</td>
    <td class="setting-col col-item">Member</td>
</tr>
<tr class="setting-row row-item text-center">
    <td class="setting-col col-item">{status-super}</td>
    <td class="setting-col col-item">{status-master}</td>
    <td class="setting-col col-item">{status-agent}</td>
    <td class="setting-col col-item">{status-member}</td>
</tr>
<tr class="setting-row row-item text-center">
    <td class="setting-col col-item" rowspan="2"><input class="edit-input" type="checkbox" {ckbCopy} />Copy From</td>
    <td class="setting-col col-item">Sport Type</td>
    <td class="setting-col col-item">Bet Type</td>
    <td class="setting-col col-item"></td>
    <td class="setting-col col-item"></td>
</tr>
<tr class="setting-row row-item text-center">
    <td class="setting-col col-item">
        <select id="{target-sporttype}" class="edit-input sel-sport-copy" data-target-settingtype="{setting-type}" data-target-bettype="{target-bettype}">
            {sporttypeopts}
        </select>
    </td>
    <td class="setting-col col-item">
        <select id="{target-bettype}" class="edit-input sel-bettype-copy">
            {bettypeopts}
        </select>
    </td>
    <td class="setting-col col-item"></td>
    <td class="setting-col col-item"></td>
</tr>
<tr class="setting-row row-item">
    <td class="setting-col col-item text-center" rowspan="2">Disable by default</td>
    <td class="setting-col col-item" colspan="4">Headline (seperate bt commas ',')</td>
</tr>
<tr class="setting-row row-item">
    <td class="setting-col col-item" colspan="4"><textarea class="edit-input" cols="75">{txtHeadline}</textarea></td>
</tr>
