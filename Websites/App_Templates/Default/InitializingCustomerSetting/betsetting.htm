<!-- Bet Setting -->
<tr class="setting-row row-item text-center">
    <td class="setting-col col-item" rowspan="2">{sport-type}</td>
    <td class="setting-col col-item" rowspan="2">{bet-type}</td>
    <td class="setting-col col-item" rowspan="2"><input id="ckbCopy{data-pos}" class="edit-input ckb-copy" type="checkbox" {ckbCopy} data-pos="{data-pos}" />Copy From</td>
    <td class="setting-col col-item">Sport Type</td>
    <td class="setting-col col-item">Bet Type</td>
    <td class="setting-col col-item"></td>
    <td class="setting-col col-item"></td>
</tr>
<tr class="setting-row row-item text-center">
    <td class="setting-col col-item">
        <select id="{target-sporttype}" class="edit-input sel-sport-copy input-copy-{data-pos}" data-target-settingtype="{setting-type}" data-target-bettype="{target-bettype}" data-pos="{data-pos}">
            {sporttypeopts}
        </select>
    </td>
    <td class="setting-col col-item">
        <select id="{target-bettype}" class="edit-input sel-bettype-copy input-copy-{data-pos}" data-pos="{data-pos}">
            {bettypeopts}
        </select>
    </td>
    <td class="setting-col col-item"></td>
    <td class="setting-col col-item"></td>
</tr>
