<table width="248px" border="0" cellspacing="0" cellpadding="0">
    <tr class="{IsHidden0}">
        <td width="25%" class="dot_left">
            Headline
        </td>
        <td width="65%" class="dot_left">
            <a href="javascript:parent.submitSearch('{CN88HeadlineName}');" class="text_blueLink">{CN88HeadlineName}</a>
        </td>
        <td align="center" class="dot_left">
            <!--HeadlineLogin-->
            <a href="javascript:LoginAgent('{CN88HeadlineName}', 0);"><img src="App_Themes/Images/home_blue.png" width="16px" height="16px" border="0px" style="vertical-align:middle;padding-bottom:3px;" /></a>
            <!--/HeadlineLogin-->
        </td>
    </tr>
    <!--SuperInfo-->
    <tr class="">
        <td width="25%" class="dot_left">
            Super
        </td>
        <td width="65%" class="dot_left">
            <a href="javascript:parent.submitSearch('{SuperName}');" class="text_blueLink">{SuperName}</a>
            <span class="ico-robot hide ico-robot-{SuperId}" title="This is a robot account."></span>
        </td>
        <td align="center" class="dot_left">
            <!--SuperLogin-->
            <a href="javascript:LoginAgent('{SuperName}');"><img src="App_Themes/Images/home_blue.png" width="16px" height="16px" border="0px" style="vertical-align:middle;padding-bottom:3px;" /></a>
            <!--/SuperLogin-->
        </td>
    </tr>
    <!--/SuperInfo-->
    <!--MasterInfo-->
    <tr class="">
        <td class="dot_left">
            Master
        </td>
        <td class="dot_left">
            <a href="javascript:parent.submitSearch('{MasterName}');" class="text_blueLink">{MasterName}</a>
            <span class="ico-robot hide ico-robot-{MasterId}" title="This is a robot account."></span>
        </td>
        <td align="center" class="dot_left">
            <!--MasterLogin-->
            <a href="javascript:LoginAgent('{MasterName}');"><img src="App_Themes/Images/home_blue.png" width="16px" height="16px" border="0px" style="vertical-align:middle;padding-bottom:3px;" /></a>
            <!--/MasterLogin-->
        </td>
    </tr>
    <!--/MasterInfo-->
    <!--AgentInfo-->
    <tr class="">
        <td class="dot_left">
            Agent
        </td>
        <td class="dot_left">
            <a href="javascript:parent.submitSearch('{AgentName}');" class="text_blueLink">{AgentName}</a>
            <span class="ico-robot hide ico-robot-{AgentId}" title="This is a robot account."></span>
        </td>
        <td class="dot_left">
            <!--AgentLogin-->
            <a href="javascript:LoginAgent('{AgentName}');"><img src="App_Themes/Images/home_blue.png" width="16px" height="16px" border="0px" style="vertical-align:middle; padding-bottom:3px;" /></a>
            <!--/AgentLogin-->
        </td>
    </tr>
    <!--/AgentInfo-->
    <tr class="hide">
        <td>
            <input id="txt-robot-ids" type="hidden" value="{RobotIds}" />
        </td>
    </tr>
</table>
