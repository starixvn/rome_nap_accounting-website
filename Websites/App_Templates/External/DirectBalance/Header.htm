<div class="main">
    <table style="width: 100%" border="0" cellpadding="0px" cellspacing="0px">
        <tr>
            <td>
                <div id="divMainHeader" class="">
                    <div id="left_tab1">
                        <ul>
                            <li class="lefticon"></li>
                            <li class="current"><span>{DirectBalance}</span></li>
                        </ul>
                    </div>
                </div>
                <div class="maincontent" style="">
                    <div class="filterBox">
                        <div class="filterContent">
                            <span id='titleDirectMaster' style="display: none"><b>{DirectMaster}</b></span><a
                                id='lkDirectMaster' href='#' onclick='ViewBalance("master")'>{DirectMaster}</a>
                            | <span id='titleDirectAgent' style="display: none"><b>{DirectAgent}</b></span><a
                                id='lkDirectAgent' href="#" onclick='ViewBalance("agent")'>{DirectAgent}</a>
                            | <span id='titleDirectMember' style="display: none"><b>{DirectMember}</b></span><a
                                id='lkDirectMember' href="#" onclick='ViewBalance("member")'>{DirectMember}</a>
                            &nbsp;
                            <input id="btnRefresh" style="display: none" class="btn" type="button" value="{Refresh}"
                                onclick="Refresh()">
                            <input style="display: none" class="btnExcel" type="button" id="btnExport" name="btnExport"
                                value="   " onclick="ExportToExcel();" title="Export to Excel" />
                            <input type="hidden" id="directType" value="" />
                            <img id='inProgressBar' name='inProgressBar' width="16px" height="16px" style="display: none"
                                src="../../App_Themes/Images/ajax-loader.gif" />
                        </div>
                    </div>
                    <div class="contentBox">
                        <div id="sData">
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</div>
