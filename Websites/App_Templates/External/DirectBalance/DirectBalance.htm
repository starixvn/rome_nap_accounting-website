<!--Content-->
<table id="table" cellspacing="1px" cellpadding="1px" class="tbllayout bg" width="500px" border="0">
<thead>
<tr class="title">
    <th class="title" colspan="5" align="center"><b>{DirectBalanceHeader}</b></th>
</tr>
<tr id="trHeader" class="title">
  <th style="width:40px"><b>{No}</b></th>
  <th><b>{Username}</b></th>
  <th style="width:60px"><b>{Curr}</b></th>
  <th><b>{Balance}</b></th>
  <th><b>{Base}</b></th>
</tr>
</thead>

<tbody>
<!--Rows-->
<tr class="{odd_even}">
  <td class="c">{No_vl}</td>
  <td class="l">{Username_vl}</td>
  <td align="center">{Curr_vl}</td>
  <td class="r">{Balance_vl}</td>
  <td class="r">{Base_vl}</td>
</tr>
<!--/Rows-->
</tbody>

<tfoot>
<!--Total-->
<tr id="trFooter" class="report-footer">
  <td align="center" colspan="4"><b>TOTAL</b></td>
  <td class="r"><b>{total}</b></td>
</tr>
<!--/Total-->
</tfoot>
</table>
<!--/Content-->
