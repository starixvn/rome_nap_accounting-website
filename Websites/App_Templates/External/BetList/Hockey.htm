<table class="tbllayout" cellspacing="1" style="width:655px;" align="center">
    <tr class="l bl-leaguename" style="background-color:#DFEAFF">
        <th colspan="7" align="center" >
            <span class="bl_time"><span class="b bl_stype">{lblSportName} - </span>&nbsp;<span class="b">{leaguename}</span></span>
        </th>
    </tr>
    <tr class="title">
        <td width="13%">
            {lblKickOffTime}
        </td>
        <td width="50%">
            {lblTeam}
        </td>
        <td width="6%">
            {lbl1P}
        </td>
        <td width="6%">
            {lbl2P}
        </td>
        <td width="6%">
            {lbl3P}
        </td>
        <td width="6%">
            {lblOT}
        </td>
        <td width="13%">
            {lblFinalScore}
        </td>
    </tr>
    <!--row-->
    <tr>
        <td rowspan="2" class="bl_time">
            {date}
        </td>
        <td class="l {hstyle}">
            {hometeam}
        </td>
        <td class="b c">
            {value1pHome}
        </td>
        <td class="b c">
            {value2pHome}
        </td>
        <td class="b c">
            {value3pHome}
        </td>
        <td class="b c">
            {valueOTHome}
        </td>
        <td class="b c">
            {homeFScore}
        </td>
    </tr>
    <tr>
        <td class="l {astyle}">
            {awayteam}
        </td>
        <td class="b c">
            {value1pAway}
        </td>
        <td class="b c">
            {value2pAway}
        </td>
        <td class="b c">
            {value3pAway}
        </td>
        <td class="b c">
            {valueOTAway}
        </td>
        <td class="b c">
            {awayFScore}
        </td>
    </tr>
    <!--/row-->
</table>
