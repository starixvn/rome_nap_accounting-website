<table class="tbllayout" cellspacing="1" style="width:655px;" align="center">
    <tr class="l bl-leaguename" style="background-color:#DFEAFF">
        <th colspan="4" align="center">
            <span class="bl_time"><span class="b bl_stype">{lblSportName} - </span>&nbsp;<span class="b">{leaguename}</span></span>
        </th>
    </tr>
    <tr class="title">
        <td width="14%">
            {lblKickOffTime}
        </td>
        <td width="65%">
            {lblTeam}
        </td>
        <td width="10%">
            {lblHTScore}
        </td>
        <td width="11%">
            {lblFinalScore}
        </td>
    </tr>
    <!--row-->
    <tr>
        <td rowspan="2" class="bl_time">
            {date}
        </td>
        <td class="l {homestyle}">
            {hometeam} {hfgoal} {hlgoal}
        </td>
        <td class="b c">
            {homeHScore}
        </td>
        <td class="b c">
            {homeFScore}
        </td>
    </tr>
    <tr>
        <td class="l {awaystyle}">
            {awayteam} {afgoal} {algoal}
        </td>
        <td class="b c">
            {awayHScore}
        </td>
        <td class="b c">
            {awayFScore}
        </td>
    </tr>
    <!--/row-->
</table>
